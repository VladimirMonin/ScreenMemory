[package]
name = "sm-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "shotd"
path = "src/main.rs"

[features]
processing-test-seams = ["sm-storage/processing-test-seams"]

[dependencies]
sm-application = { path = "../application" }
sm-capture = { path = "../capture" }
sm-codec = { path = "../codec" }
sm-credentials = { path = "../credentials" }
sm-domain = { path = "../domain" }
sm-framing = { path = "../framing" }
sm-isolation = { path = "../isolation" }
sm-image-worker = { path = "../image-worker" }
sha2.workspace = true
sm-observability = { path = "../observability" }
sm-pipe = { path = "../pipe" }
sm-protocol = { path = "../protocol" }
sm-session = { path = "../session" }
sm-storage = { path = "../storage" }
sm-runtime = { path = "../runtime" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["rt", "rt-multi-thread", "time", "io-util", "sync"] }
tokio-util.workspace = true
uuid = { workspace = true, features = ["v4"] }

zeroize.workspace = true

[dev-dependencies]
