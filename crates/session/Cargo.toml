[package]
name = "sm-session"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sm-application = { path = "../application" }
sm-domain = { path = "../domain" }
sm-protocol = { path = "../protocol" }
sm-framing = { path = "../framing" }
sm-pipe = { path = "../pipe" }
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio-util.workspace = true
tokio = { version = "=1.53.1", features = ["net", "rt", "sync", "time", "io-util", "macros"] }

[dev-dependencies]
async-trait.workspace = true
sm-isolation = { path = "../isolation" }
sm-storage = { path = "../storage" }
sm-image = { path = "../image" }
sm-image-worker = { path = "../image-worker" }
