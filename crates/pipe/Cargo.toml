[package]
name = "sm-pipe"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sm-isolation = { path = "../isolation" }
sha2.workspace = true
tokio = { version = "=1.53.1", features = ["net", "rt", "sync", "time", "io-util"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_SystemServices"] }

[dev-dependencies]
sm-framing = { path = "../framing" }
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["net", "rt", "sync", "time", "io-util", "macros", "rt-multi-thread"] }
