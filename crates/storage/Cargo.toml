[package]
name = "sm-storage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
processing-test-seams = []

[dependencies]
sm-application = { path = "../application" }
sm-codec = { path = "../codec" }
sm-image = { path = "../image" }
sm-image-worker = { path = "../image-worker" }
sm-protocol = { path = "../protocol" }
sm-domain = { path = "../domain" }
sm-isolation = { path = "../isolation" }
async-trait.workspace = true
rusqlite = { version = "=0.37.0", features = ["bundled"] }
sha2 = "=0.10.9"
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
tokio = { version = "=1.53.1", features = ["sync", "time", "rt"] }
