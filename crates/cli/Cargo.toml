[package]
name = "sm-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "shot"
path = "src/main.rs"

[dependencies]
sm-application = { path = "../application" }
sm-credentials = { path = "../credentials" }
sm-domain = { path = "../domain" }
sm-framing = { path = "../framing" }
sm-isolation = { path = "../isolation" }
sm-pipe = { path = "../pipe" }
sm-protocol = { path = "../protocol" }
sm-session = { path = "../session" }
serde.workspace = true
serde_json.workspace = true
tokio = { version = "=1.53.1", features = ["rt", "time", "io-util"] }
uuid = { workspace = true, features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[dev-dependencies]
sm-host = { path = "../host" }
tokio-util.workspace = true
uuid = { workspace = true, features = ["v4"] }
