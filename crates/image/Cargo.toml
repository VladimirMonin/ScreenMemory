[package]
name = "sm-image"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sm-codec = { path = "../codec" }
serde.workspace = true
sha2.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "tiff"] }
libavif-sys = { version = "=0.17.0", default-features = false, features = ["codec-aom"] }
libaom-sys = "=0.17.2"
kamadak-exif = "=0.6.1"
quick-xml = "=0.42.0"
lcms2 = { version = "=6.2.0", default-features = false, features = ["static"] }
time = { version = "=0.3.47", features = ["parsing", "formatting"] }

[dev-dependencies]
tiff = { version = "=0.11.3", default-features = false, features = ["lzw", "deflate"] }
