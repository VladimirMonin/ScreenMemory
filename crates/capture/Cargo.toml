[package]
name = "sm-capture"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Live tests read the whole desktop, not just their synthetic windows. Never run them
# on a personal session. Opt-in belongs to the isolated S02/S08 Windows test harness.
[features]
default = []
isolated-desktop-tests = []

[[test]]
name = "live_capture"
path = "tests/live_capture.rs"
required-features = ["isolated-desktop-tests"]

[dependencies]
sm-application = { path = "../application" }
uuid = { workspace = true, features = ["v4"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_System_ProcessStatus", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
