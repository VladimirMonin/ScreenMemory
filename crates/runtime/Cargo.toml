[package]
name = "sm-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
sm-application = { path = "../application" }
sm-domain = { path = "../domain" }
sm-protocol = { path = "../protocol" }
sm-storage = { path = "../storage" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid = { workspace = true, features = ["v4"] }
sha2.workspace = true
zeroize.workspace = true
getrandom.workspace = true
tokio-util.workspace = true
tokio = { version = "=1.53.1", features = ["process", "io-util", "sync", "time", "rt", "macros"] }
windows-sys = { workspace = true, features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Security", "Win32_Storage_FileSystem"] }

[dev-dependencies]
sm-isolation = { path = "../isolation" }
sm-image-worker = { path = "../image-worker" }
