[workspace]
members = ["crates/domain", "crates/protocol", "crates/application", "crates/observability", "crates/isolation"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.98.1"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
uuid = { version = "=1.23.1", features = ["serde"] }
schemars = "=1.2.1"
async-trait = "=0.1.89"
tokio-util = "=0.7.18"
